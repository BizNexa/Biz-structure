# Registration deadlines and effective-date rules. Attached to triggers through deadline_ids.

deadlines:
  - id: DL-S25-1-30-DAYS
    description: A person liable under s.22 or s.24 (other than casual and non-resident taxable persons) must apply within 30 days from the date liability arises, in every State/UT where liable.
    plain_language: Apply within 30 days of the date you first become liable to register.
    legal_basis: "s.25(1) CGST Act; handbook table 2.1 row A"
    source_ref: [{ doc: handbook, page: 43, pdf_page: 49, section: "2.1 Registration Requirement table" }]
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: Persons making supply from territorial waters register in the coastal State/UT nearest the baseline, also within 30 days (row C); not asked in v1.

  - id: DL-CTP-NRTP-5-DAYS
    description: A casual or non-resident taxable person must apply at least 5 days before commencing business.
    plain_language: Apply at least 5 days before you start supplying.
    legal_basis: "s.25(1) proviso; Rule 13(1) CGST Rules"
    source_ref:
      - { doc: handbook, page: 43, pdf_page: 49, section: "2.1 table row B" }
      - { doc: handbook, page: 21, pdf_page: 27, section: "1.5.2 Registration" }
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: ""

  - id: DL-CTP-NRTP-VALIDITY
    description: Registration of a casual or non-resident taxable person is valid for the period applied for or 90 days from the effective date, whichever is earlier; extendable once by up to 90 days on REG-11, filed before expiry, with an additional advance deposit.
    plain_language: The registration lasts up to 90 days and can be extended once by up to 90 more days.
    legal_basis: "s.27(1), s.27(2) proviso CGST Act; Rule 15(1)"
    source_ref: [{ doc: handbook, page: 65, pdf_page: 71, section: "2.1.2 Validity; Extension" }]
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: ""

  - id: DL-EFFECTIVE-DATE-RULE10
    description: Registration is effective from the date the person becomes liable if the application is made within 30 days of liability; otherwise from the date of grant.
    plain_language: If you apply within 30 days, your registration counts from the day you became liable; if later, only from the date it is granted.
    legal_basis: "Rule 10 CGST Rules"
    source_ref: [{ doc: handbook, page: 61, pdf_page: 67, section: "2.1 Grant of Registration Certificate (iii)" }]
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: ""

  - id: DL-S22-3-TRANSFER
    description: The transferee or successor is liable to register with effect from the date of transfer or succession.
    plain_language: Registration is required from the date you take over the business.
    legal_basis: "s.22(3) CGST Act"
    source_ref: [{ doc: handbook, page: 14, pdf_page: 20, section: "1.3.3" }]
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: The application time limit (30 days, s.25(1)) also applies.

  - id: DL-S22-4-AMALGAMATION
    description: The transferee is liable to register from the date the Registrar of Companies issues the certificate of incorporation giving effect to the amalgamation or demerger order.
    plain_language: Registration is required from the date the Registrar of Companies gives effect to the scheme.
    legal_basis: "s.22(4) CGST Act"
    source_ref: [{ doc: handbook, page: 14, pdf_page: 20, section: "1.3.4" }]
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: ""
