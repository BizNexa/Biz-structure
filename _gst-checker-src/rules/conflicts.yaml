  - id: C-008
    title: "Rule 14A: who is a \"person covered under s.25(6D)\"?"
    description: >-
      The handbook says the applicant must not be "a person covered under Section 25(6D) (i.e., notified
      mandatory registrants)". s.25(6D) is the power to exempt persons from Aadhaar authentication
      (Notification 3/2021-CT, handbook p. 51). The gloss does not match the provision.
    positions:
      - { source: "Handbook p. 62 (PDF 68)", says: "not a person covered under s.25(6D) (i.e., notified mandatory registrants)", verification_status: handbook }
      - { source: "Handbook p. 50-51 (PDF 56-57)", says: "s.25(6D) persons = non-citizens, government departments, local authorities, statutory bodies, PSUs, UIN applicants", verification_status: handbook }
    related_ids: [R14A-NOT-25-6D]
    how_modelled: Condition uses the Aadhaar-exempt classes; marked conflict.
    status: open
    resolution: null

