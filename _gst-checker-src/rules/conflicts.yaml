  - id: C-014
    title: Small exporter of services - must it register?
    description: >-
      Handbook Illustration 6 says exports are inter-State supplies and all exporters must register
      regardless of turnover. Notification 10/2017-IT (handbook p. 19-20) exempts persons making
      inter-State supplies of taxable services with turnover within Rs 20 lakh (Rs 10 lakh). The
      illustration concerns a dealer in goods.
    positions:
      - { source: "Handbook p. 16 (PDF 22) Illustration 6", says: "All exporters, regardless of turnover limit, must obtain registration", verification_status: handbook }
      - { source: "Handbook p. 19-20 (PDF 25-26) Notification 10/2017-IT", says: "Inter-State suppliers of services within the threshold are exempt", verification_status: handbook }
    related_ids: [EX-N10-2017-IT-SERVICES-EXPORTER, EX-N10-2017-IT-INTERSTATE-SERVICES, S24-I-INTERSTATE]
    how_modelled: Goods exporters are mandatory under s.24(i). Services-only exporters within the threshold go to NEEDS_CA_REVIEW.
    status: open
    resolution: null
