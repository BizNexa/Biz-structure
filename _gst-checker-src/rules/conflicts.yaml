  - id: C-005
    title: Does a blanket s.23 exemption override non-supplier s.24 triggers?
    description: >-
      The handbook (p. 18) says that after the Finance Act 2023 substitution, s.23 overrides s.22 and s.24.
      But Circular 57/31/2018-GST (handbook p. 33) says a commission agent exempt under s.23(1)(a) must
      still register under s.24(iii) if liable to reverse charge. Registrations as RCM recipient, TDS
      deductor, ISD, TCS collector or s.9(5) operator are not registrations as a supplier of exempt goods.
    positions:
      - { source: "Handbook p. 18 (PDF 24)", says: "s.23 overrides s.22 and s.24", verification_status: handbook }
      - { source: "Circular 57/31/2018-GST para 9, handbook p. 33 (PDF 39)", says: "RCM-liable commission agent must register under s.24(iii) despite s.23(1)(a)", verification_status: handbook }
    related_ids: [S24-III-RCM, S24-IV-ECO-9-5, S24-VI-TDS, S24-VI-TDS-METAL-SCRAP, S24-VI-TDS-NEW-SCRAP, S24-VIII-ISD, S24-X-TCS, S22-3-TRANSFER, S22-4-AMALGAMATION, EX-S23-1A-EXEMPT-ONLY, EX-S23-1B-AGRICULTURIST, EX-N5-2017-RCM-ONLY, EX-N5-2017-RCM-ONLY-2024]
    how_modelled: Triggers carry s23_override. "displaced" = removed by a blanket exemption; "ca_review" = overlap returns NEEDS_CA_REVIEW with this conflict cited.
    status: open
    resolution: null

  - id: C-006
    title: Goods supplier with exempt interest income - Rs 40 lakh limit
    description: >-
      Explanation to s.22(1) treats a supplier of goods with exempt interest/discount income as engaged
      exclusively in goods. Notification 10/2019-CT has no such explanation. The handbook (p. 4-6)
      reports two schools of thought and advises caution or an advance ruling.
    positions:
      - { source: "Handbook p. 5 (PDF 11) prevailing view", says: "Any supply of services, even exempt, may disqualify from the Rs 40 lakh exemption", verification_status: handbook }
      - { source: "Handbook p. 5-6 (PDF 11-12) alternative view", says: "Interest income does not disqualify (from 01.01.2020)", verification_status: handbook }
    related_ids: [EX-N10-2019-CT-GOODS-40L, S22-1-THRESHOLD]
    how_modelled: If the only services are exempt interest/discount and turnover falls between the Rs 20 lakh and Rs 40 lakh limits, the verdict is NEEDS_CA_REVIEW.
    status: open
    resolution: null

