# Aggregate turnover thresholds (Rs lakh) by State category and period.
# Source: handbook threshold table, p. 7-8 (PDF 13-14), read with s.22(1) provisos (p. 2-3)
# and Notification 10/2019-CT (p. 3-4, 9).
# goods_only_lakh applies only to a supplier engaged EXCLUSIVELY in supply of goods who does not
# supply the goods excluded by Notification 10/2019-CT and is not a s.24 person. The engine applies
# those conditions (see engine/thresholds.ts); otherwise services_or_mixed_lakh applies.
# Liability arises when aggregate turnover EXCEEDS the limit.

hb_thr: &hb_thr
  - { doc: handbook, page: 7, pdf_page: 13, section: "1.3.1 Turnover threshold table" }
  - { doc: handbook, page: 2, pdf_page: 8, section: "1.3.1 s.22(1) and provisos" }

thresholds:
