    threshold_category: SCS_EXPL
    description: Manipur, Mizoram, Nagaland, Tripura up to 31 Jan 2019 - Rs 10 lakh for all supplies.
    services_or_mixed_lakh: 10
    goods_only_lakh: 10
    goods_only_basis: none
    legal_basis: s.22(1) first proviso
    source_ref: *hb_thr
