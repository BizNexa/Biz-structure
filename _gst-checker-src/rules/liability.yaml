  # =========================== Voluntary ===========================
  - id: VOL-S25-3
    topic: voluntary
    outcome: VOLUNTARY
    legal_basis: "s.25(3) CGST Act"
    description: >-
      A person not liable under s.22 or s.24 may register voluntarily, and is then treated like any
      other registered person (invoicing, returns, ITC).
    plain_language: You are not required to register, but you may choose to, for example to claim input tax credit or sell to GST-registered businesses.
    applies_if: { fact: wants_voluntary, equals: true }
    ca_question: Does the client want to register voluntarily (ITC, B2B customers), accepting full compliance obligations?
    deadline_ids: [DL-EFFECTIVE-DATE-RULE10]
    route_hint: ROUTE-REG01-NORMAL
    source_ref: [{ doc: handbook, page: 45, pdf_page: 51, section: "2.1 Voluntary Registration" }]
    effective_from: 2017-07-01
    effective_to: null
    verification_status: handbook
    confidence: certain
    notes: >-
      A voluntary registrant loses the Notification 10/2019-CT Rs 40 lakh exemption (clause (d)). The
      engine does not treat "don't know" on this preference as a legal uncertainty; it adds an open
      question instead (design decision for CA sign-off).
