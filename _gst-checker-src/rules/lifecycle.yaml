# Amendment, cancellation, suspension and revocation. OUT OF SCOPE for v1: recorded here so that v2
# can add these workflows. The engine does not evaluate these records; CA mode lists those in force
# on the as-of date.

lifecycle:
  - id: LC-AMEND-RULE19-2017
    topic: amendment
    legal_basis: "s.28 CGST Act; Rule 19"
    description: Changes in registration particulars are applied for on REG-14 within 15 days of the change. Core fields (legal name without PAN change, place of business address, partners/directors/Karta etc.) need officer approval within 15 working days (REG-15); non-core fields are auto-approved.
    source_ref: [{ doc: handbook, page: 109, pdf_page: 115, section: "3.1" }]
    effective_from: 2017-07-01
    effective_to: 2026-10-31
    verification_status: handbook
    confidence: certain
    notes: End date from the research note (Rule 19 substituted from 1 Nov 2026).

  - id: LC-AMEND-RULE19-2026
    topic: amendment
    legal_basis: "Rule 19 as substituted by Notification 05/2026-CT; GSTN Advisory 686"
    description: Most amendments (legal name, partners/directors/Karta, additional place of business) are auto-approved after online validation; PPOB changes still need officer approval; OTP verification by the primary authorised signatory and one promoter within 3 days or no ARN; PAN/DIN/CIN validated electronically.
    source_ref: [{ doc: research, page: 4, section: "C. Amendments, Rule 19 (Advisory 686)" }]
    effective_from: 2026-11-01
    effective_to: null
    verification_status: secondary
    confidence: likely
    notes: ""

